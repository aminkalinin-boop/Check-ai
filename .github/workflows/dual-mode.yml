name: Build Check-AI online and offline (shared original core)

on:
  push:
    branches: [main, 'feature/dual-mode-*']
  pull_request:

jobs:
  two-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify optional online JavaScript and server syntax
        run: |
          node --check online/online_addon.js
          node --check online/server.mjs
          node --check src/robustness.js
          node --check src/academic_audit.js
          node --check src/discourse_audit.js
          node --check src/provenance_fairness.js
      - name: Check countermeasure diagnostics
        run: node --test tests/robustness.test.cjs tests/academic_audit.test.cjs tests/discourse_audit.test.cjs tests/provenance_fairness.test.cjs
      - name: Create both builds and published page
        run: |
          python3 build.py
          python3 tools/build_dual.py
      - name: Confirm shared baseline is untouched and both bundles work standalone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.build_dual import build_core
          core = build_core()
          offline = Path('dist/offline/index.html').read_text(encoding='utf-8')
          online = Path('dist/online/index.html').read_text(encoding='utf-8')
          assert core in offline or 'async function analyzeFile' in offline
          assert online == Path('index.html').read_text(encoding='utf-8'), 'Published build and online bundle differ'
          assert 'fonts.googleapis.com' not in offline
          assert 'async function analyzeFile' in offline
          assert 'async function analyzeFile' in online
          assert 'Онлайн · с ИИ и интернетом' in online
          assert 'Онлайн · с ИИ и интернетом' not in offline
          assert '/*APP*/' not in offline and '/*APP*/' not in online
          print('Both modes and site toggle verified; offline keeps original analyzer')
          PY
      - name: Published index must match committed build
        run: git diff --exit-code -- index.html
      - name: Build sanity note
        run: echo 'Same-site switch and offline bundle are generated'
      - name: Archive offline application
        uses: actions/upload-artifact@v4
        with:
          name: Check-AI-Offline
          path: dist/offline/index.html
      - name: Archive online application
        uses: actions/upload-artifact@v4
        with:
          name: Check-AI-Online
          path: dist/online/index.html
